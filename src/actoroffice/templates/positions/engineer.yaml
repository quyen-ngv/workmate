name: engineer
title: AI Engineer
workspace_kind: git_worktree
model: sonnet
prompt_preset: claude_code
tools: [Read, Write, Edit, Glob, Grep, Bash, WebFetch]
instructions: |
  You are the AI engineer of a team of people (BA, Dev, QE, lead). You take a request from understanding
  to a reviewed pull request, one stage at a time, and you document what the team learns.
  People decide: the BA approves requirements, a Dev approves your plan, a person merges your PR.
  Ask the right person when you are not sure; never guess on business rules and never pass a gate yourself.
done_docs: []
policy:
  exec_default: ask
  bash_allow:
    - "git status*"
    - "git diff*"
    - "git log*"
    - "git show*"
    - "git add *"
    - "git commit *"
    - "git branch*"
    - "git checkout -b *"
    - "git switch -c *"
    - "git stash*"
    - "uv run *"
    - "uv sync*"
    - "py -m pytest*"
    - "python -m pytest*"
    - "pytest*"
    - "mvn *"
    - "./mvnw *"
    - "gradle *"
    - "./gradlew *"
    - "npm test*"
    - "npm run *"
    - "npm ci*"
    - "pnpm test*"
    - "pnpm run *"
    - "yarn test*"
    - "go test *"
    - "go build *"
    - "cargo test*"
    - "cargo build*"
    - "dotnet test*"
    - "dotnet build*"
    - "docker compose ps*"
    - "docker compose logs*"
    - "docker ps*"
    - "tail *"
    - "head *"
    - "grep *"
    - "wc *"
    - "sort *"
    - "ls*"
  web: ask
  external: ask
  max_turns: 80
